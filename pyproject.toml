[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "chaoxing-agent"
version = "0.3.0"
description = "Agent-facing MCP and CLI controls for Chaoxing Learning"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "cryptography>=43,<51",
  "mcp>=2.1,<3",
  "requests>=2.32,<3",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.4,<9",
  "pytest-asyncio>=1.1,<2",
  "ruff>=0.12,<1",
]

[project.scripts]
chaoxing-agent = "chaoxing_agent.cli:main"
chaoxing-agent-mcp = "chaoxing_agent.mcp_server:main"

[tool.hatch.build.targets.wheel]
packages = ["src/chaoxing_agent"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
